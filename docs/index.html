    ta.addEventListener("blur", save);
    body.querySelector('[data-a="time"]').onclick = () => {
      const p = ta.selectionStart ?? ta.value.length;
      const nl = ta.value.slice(0, p) && !ta.value.slice(0, p).endsWith("\n") ? "\n" : "";
      ta.setRangeText(`${nl}[${fmt(player.time)}] `, p, ta.selectionEnd ?? p, "end");
      ta.focus(); grow(); save();
    };
    body.querySelector('[data-a="copy"]').onclick = () => { copyText(`${current.title}\n\n${ta.value}`); toast("Lyrics copied"); };
    $("lyrSaved").textContent = lyrics[id] ? `Saved ${agoTime(lyrics[id].at)}` : "";
    requestAnimationFrame(grow);
  }

  const canRecord = () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  async function renderRecord() {
    const body = $("studioBody"), beat = current;
    if (!canRecord()) { body.innerHTML = `<div class="studio-note">Recording isn't supported in this browser.</div>`; return; }
    body.innerHTML = `
      <div class="rec-main">
        <button class="rec-btn${rec ? " on" : ""}" id="recBtn" aria-label="Record"><span></span></button>
        <div class="rec-time" id="recTime">Tap to record<small>The beat plays while you rap. Use headphones so the mic only hears you.</small></div>
      </div>
      <div class="studio-row"><button class="small-btn" id="fromTop">${icon(fromTop ? "loop" : "play")}${fromTop ? "Beat starts from 0:00" : "Beat continues from here"}</button></div>
      <ul class="takes" id="takes"></ul>`;
    $("recBtn").onclick = () => (rec ? stopRecording() : startRecording(beat));
    $("fromTop").onclick = () => { fromTop = !fromTop; store.set("recFromTop", fromTop); studioFor = null; renderStudio(); };
    await renderTakes(beat);
  }

  async function startRecording(beat) {
    if (!player.started) return toast("Tap the video to start the beat once, then record");
    stopTake();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    } catch {
      return toast("Microphone blocked. Allow it in Settings → Apps → Safari → Microphone.");
    }
    const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported?.(t)) || "";
    const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    // Remember where in the beat this take starts, so playback can line the vocals back up.
    const beatTime = fromTop ? 0 : player.time;
    if (fromTop) send("seekTo", [0, true]);
    wantPlaying = true; send("playVideo");
    rec = { mr, chunks, stream, beat, beatTime, fromTop, anchor: null, perf: performance.now(), startedAt: Date.now(), type: mr.mimeType || type || "audio/webm" };
    mr.start(250);
    rec.timer = setInterval(paintRec, 250);
    paintRec();
    $("recBtn")?.classList.add("on");
  }

  function paintRec() {
    if (!rec || !$("recTime")) return;
    const el = (Date.now() - rec.startedAt) / 1000;
    $("recTime").innerHTML = `<span class="rec-dot"></span>${fmt(el)}<small>Recording · tap ■ to stop</small>`;
  }

  function stopRecording() {
    if (!rec) return;
    const r = rec; rec = null;
    clearInterval(r.timer);
    const dur = (Date.now() - r.startedAt) / 1000;
    r.mr.onstop = async () => {
      r.stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(r.chunks, { type: r.type });
      const take = { id: `${r.beat.id}-${r.startedAt}`, beat: r.beat.id, beatTitle: r.beat.title, at: r.startedAt,
        beatTime: r.anchor ?? r.beatTime, sync: syncDefault, dur, type: r.type, blob };
      try { await idb.put(take); toast("Take saved"); } catch { toast("Couldn't save the take on this device"); }
      if (current?.id === r.beat.id && studioTab === "record" && route.view === "watch") renderRecord();
    };
    r.mr.stop();
    $("recBtn")?.classList.remove("on");
  }

  async function renderTakes(beat) {
    let takes = [];
    try { takes = (await idb.byBeat(beat.id)).sort((a, b) => b.at - a.at); } catch {}
    const ul = $("takes");
    if (!ul || current?.id !== beat.id) return;
    ul.innerHTML = takes.length ? "" : `<li class="studio-note">No takes yet.</li>`;
    takes.forEach((t, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<div class="t-head">Take ${takes.length - i}<span>${fmt(t.dur)} · from ${fmt(Math.max(0, t.beatTime))} · ${agoTime(t.at)}</span></div>
        <div class="studio-row">
          <button class="small-btn" data-a="both">${icon("play")}Play with beat</button>
          <button class="small-btn" data-a="solo">${icon("mic")}Vocals only</button>
          <button class="small-btn" data-a="save">${icon("download")}Save</button>
          <button class="small-btn danger" data-a="del" aria-label="Delete take">${icon("trash")}</button>
        </div>
        <div class="sync-row">
          <span class="studio-note">Sync</span>
          <button class="small-btn" data-a="earlier" aria-label="Move vocals earlier">− Earlier</button>
          <span class="sync-val" data-a="val"></span>
          <button class="small-btn" data-a="later" aria-label="Move vocals later">Later +</button>
        </div>`;
      const val = li.querySelector('[data-a="val"]');
      const paintSync = () => { const ms = t.sync || 0; val.textContent = ms === 0 ? "on time" : `${Math.abs(ms)} ms ${ms > 0 ? "later" : "earlier"}`; };
      const nudge = (d) => {
        t.sync = (t.sync || 0) + d;
        paintSync();
        // Adjust live if this take is playing with the beat, so you can tune it by ear.
        if (takePlayer?.key === t.id + ":beat" && !takePlayer.audio.paused) takePlayer.audio.currentTime = Math.max(0, takePlayer.audio.currentTime - d / 1000);
        syncDefault = t.sync; store.set("syncDefault", syncDefault); // new takes start from your last setting
        idb.put(t).catch(() => {});
      };
      li.querySelector('[data-a="earlier"]').onclick = () => nudge(-SYNC_STEP);
      li.querySelector('[data-a="later"]').onclick = () => nudge(SYNC_STEP);
      paintSync();
      li.querySelector('[data-a="both"]').onclick = (e) => playTake(t, true, e.currentTarget);
      li.querySelector('[data-a="solo"]').onclick = (e) => playTake(t, false, e.currentTarget);
      li.querySelector('[data-a="save"]').onclick = () => saveTake(t);
      li.querySelector('[data-a="del"]').onclick = async () => {
        if (!confirm(`Delete take ${takes.length - i}? This can't be undone.`)) return;
        stopTake(); await idb.del(t.id).catch(() => {}); renderTakes(beat);
      };
      ul.append(li);
    });
  }

  function stopTake() {
    if (!takePlayer) return;
    clearInterval(takePlayer.wait); clearTimeout(takePlayer.wait);
    takePlayer.audio.pause();
    URL.revokeObjectURL(takePlayer.url);
    if (takePlayer.btn) takePlayer.btn.innerHTML = takePlayer.label;
    takePlayer = null;
  }

  function playTake(t, withBeat, btn) {
    const key = t.id + (withBeat ? ":beat" : ":solo");
    const same = takePlayer?.key === key;
    stopTake();
    if (same) { if (withBeat) send("pauseVideo"); return; }
    if (withBeat && !player.started) return toast("Tap the video to start the beat once, then play the take");
    const url = URL.createObjectURL(t.blob);
    const audio = new Audio(url);
    audio.playsInline = true;
    takePlayer = { key, audio, url, btn, label: btn.innerHTML };
    btn.innerHTML = `${icon("pause")}Stop`;
    audio.onended = () => { stopTake(); if (withBeat) send("pauseVideo"); };
    if (!withBeat) { if (player.state === 1) send("pauseVideo"); audio.play().catch(() => toast("Couldn't play the take")); return; }
    // iPhone only lets audio start from a tap, so unlock it now (muted), then start it for real once the beat has caught up.
    audio.muted = true;
    audio.play().then(() => { audio.pause(); audio.currentTime = 0; audio.muted = false; }).catch(() => {});
    const startAt = Math.max(0, t.beatTime);
    send("seekTo", [startAt, true]); send("playVideo"); wantPlaying = true;
    const t0 = Date.now();
    takePlayer.wait = setInterval(() => {
      const ready = player.state === 1 && player.timeAt > 0 && Math.abs(player.time - startAt) < 1.5;
      if (!ready && Date.now() - t0 < 3000) return;
      clearInterval(takePlayer?.wait);
      // Where the vocals should be right now, given where the beat is and your sync nudge (positive = later).
      const pos = beatNow() - t.beatTime - (t.sync || 0) / 1000;
      audio.muted = false;
      const go = () => audio.play().catch(() => toast("Couldn't play the take"));
      if (pos >= 0) { audio.currentTime = pos; go(); }
      else { audio.currentTime = 0; takePlayer.wait = setTimeout(go, -pos * 1000); }
    }, 50);
  }

  function saveTake(t) {
    const ext = t.type.includes("mp4") ? "m4a" : "webm";
    const name = `${(t.beatTitle || "beat").replace(/[^\w\- ]+/g, "").trim().slice(0, 40) || "beat"} - take.${ext}`;
    const file = new File([t.blob], name, { type: t.type });
    if (navigator.canShare?.({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch((e) => { if (e.name !== "AbortError") toast("Couldn't share the file"); });
      return;
    }
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(file), download: name });
    document.body.append(a); a.click(); a.remove();
  }

  async function renderNotebook(root) {
    let takes = [];
    try { takes = await idb.all(); } catch {}
    if (route.view !== "notebook") return;
    const counts = {}, last = {};
    for (const t of takes) { counts[t.beat] = (counts[t.beat] || 0) + 1; last[t.beat] = Math.max(last[t.beat] || 0, t.at); }
    const ids = [...new Set([...Object.keys(lyrics), ...Object.keys(counts)])];
    const items = ids.map((id) => ({ v: findVideo(id), at: Math.max(lyrics[id]?.at || 0, last[id] || 0) })).filter((x) => x.v).sort((a, b) => b.at - a.at);
    root.insertAdjacentHTML("beforeend", `<div class="section-head"><h2>Notebook</h2><span class="sub">${items.length} beat${items.length === 1 ? "" : "s"}</span></div>`);
    if (!items.length) {
      root.insertAdjacentHTML("beforeend", `<div class="empty"><strong>Nothing written yet</strong>Open any beat and use Lyrics or Record under the video.</div>`);
      return;
    }
    const list = items.map((x) => x.v);
    const ul = document.createElement("ul");
    ul.className = "vlist";
    for (const { v, at } of items) {
      const li = document.createElement("li");
      li.className = "vrow nb-item";
      const preview = (lyrics[v.id]?.text || "").trim().split("\n").slice(0, 2).join("\n");
      li.innerHTML = `${thumbHTML(v)}<div class="meta"><div class="vtitle">${esc(v.title)}</div>
        <div class="nb-preview">${preview ? esc(preview) : "<i>No lyrics yet</i>"}</div>
        <div class="vsub">${counts[v.id] ? `${counts[v.id]} take${counts[v.id] > 1 ? "s" : ""} · ` : ""}${agoTime(at)}</div></div>`;
      li.onclick = () => { studioTab = lyrics[v.id] ? "lyrics" : "record"; studioFor = null; playFrom(v, list); };
      ul.append(li);
    }
    root.append(ul);
  }

  // ---------- player: youtube-nocookie embed driven by postMessage (no YouTube scripts on this page) ----------
  const ORIGIN = "https://www.youtube-nocookie.com";
  const iframe = $("yt");
  const send = (func, args = []) => iframe.contentWindow?.postMessage(JSON.stringify({ event: "command", func, args, id: 1, channel: "widget" }), ORIGIN);
  const embedUrl = (id) => `${ORIGIN}/embed/${id}?` + new URLSearchParams({
    enablejsapi: 1, controls: 0, playsinline: 1, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0, modestbranding: 1, autoplay: 1, origin: location.origin,
  });

  // Play v with `list` as the queue, and show the watch page.
  function playFrom(v, list) {
    startVideo(v, list);
    if (route.view === "watch") {
      history.replaceState({ ...history.state, view: "watch", id: v.id }, "", hashFor({ view: "watch", id: v.id }));
      route = { view: "watch", id: v.id };
      document.body.dataset.tab = queueTab;
      renderChrome(); renderStage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      go({ view: "watch", id: v.id });
    }
  }

  function startVideo(v, list) {
    current = v;
    queue = list.slice();
    queueTab = sectionOf(v.id);
    $("frame").classList.remove("ended");
    // Once the player was started by a tap, reuse it: iOS then lets loadVideoById autoplay.
    if (player.ready && player.started) send("loadVideoById", [v.id]);
    else { player = freshPlayer(); $("frame").classList.remove("started"); iframe.src = embedUrl(v.id); }
    watched.add(v.id); store.set("watched", [...watched].slice(-3000));
    recent = [{ id: v.id, at: Date.now() }, ...recent.filter((h) => h.id !== v.id)].slice(0, 200);
    store.set("history", recent);
    // Learn videos pick up where you left off (unless you were basically done).
    const p = positions[v.id];
    pendingSeek = queueTab === "learn" && p && p.t > 20 && p.t < p.d - 30 ? p.t : 0;
    player.time = 0; player.dur = 0; paintTime();
  }

  function step(dir) {
    if (!current || !queue.length) return;
    const i = queue.findIndex((x) => x.id === current.id);
    playFrom(queue[(i + dir + queue.length) % queue.length], queue);
  }
  const next = () => step(1);

  iframe.addEventListener("load", () => {
    if (!iframe.src.startsWith(ORIGIN)) return;
    let tries = 0; // say hello until the embed starts streaming its state back
    const t = setInterval(() => {
      iframe.contentWindow?.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), ORIGIN);
      if (player.ready || ++tries > 40) clearInterval(t);
    }, 250);
  });

  window.addEventListener("message", (e) => {
    if (e.origin !== ORIGIN || typeof e.data !== "string") return;
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (e.source === sframe.contentWindow) return onShortsMessage(msg);
    if (e.source !== iframe.contentWindow) return;
    const info = msg.info;
    if (msg.event === "onReady") player.ready = true;
    if (msg.event === "infoDelivery" && info) {
      player.ready = true;
      // Linked videos aren't in the library, so take their title from the player itself.
      const vd = info.videoData;
      if (current?.external && vd?.title && current.title !== vd.title && vd.video_id === current.id) {
        current.title = vd.title; current.channel = vd.author || "";
        linkLog = linkLog.map((x) => (x.id === current.id ? { ...x, title: vd.title, channel: vd.author || "" } : x));
        store.set("linklog", linkLog);
        if (route.view === "watch") { renderInfo(); renderChrome(); }
        $("miniTitle").textContent = current.title; $("miniSub").textContent = current.channel;
      }
      if (typeof info.currentTime === "number") { player.time = info.currentTime; player.timeAt = performance.now(); }
      if (typeof info.duration === "number" && info.duration) player.dur = info.duration;
      if (typeof info.playerState === "number") onState(info.playerState);
      paintTime();
      // While recording: work out exactly where the beat was when the mic started (the beat takes a moment to start).
      if (rec && rec.anchor == null && player.state === 1 && player.timeAt > rec.perf + 100 && (!rec.fromTop || player.time < 3)) {
        rec.anchor = player.time - (player.timeAt - rec.perf) / 1000;
      }
      if (current && player.dur && player.time > 5 && Date.now() - lastSave > 5000) {
        lastSave = Date.now();
        positions[current.id] = { t: Math.round(player.time), d: Math.round(player.dur) };
        const ids = Object.keys(positions);
        if (ids.length > 300) ids.slice(0, ids.length - 300).forEach((k) => delete positions[k]);
        store.set("positions", positions);
      }
    }
    if (msg.event === "onStateChange") onState(typeof info === "number" ? info : info?.playerState);
  });

  function onState(s) {
    if (s === player.state) return;
    player.state = s;
    if (s === 1) {
      wantPlaying = true;
      if (pendingSeek) { send("seekTo", [pendingSeek, true]); pendingSeek = 0; }
      player.started = true;
      $("frame").classList.add("started");
      $("frame").classList.remove("ended");
    }
    if (s === 0) { if (current) { delete positions[current.id]; store.set("positions", positions); } onEnded(); }
    // iOS pauses web video when you leave the app or lock the screen; right after that, ask it to keep going.
    // Only in that window, so a pause you make from the lock screen sticks.
    if (s === 2 && wantPlaying && document.hidden && Date.now() - hiddenAt < 4000) resumeInBackground();
    paintPP();
  }

  function onEnded() {
    const mode = modes[queueTab];
    if (mode === "loop") { send("seekTo", [0, true]); send("playVideo"); return; }
    if (mode === "next") { next(); return; }
    $("frame").classList.add("ended"); // cover YouTube's end screen
  }

  function resumeInBackground() {
    [0, 300, 900, 2000].forEach((ms) => setTimeout(() => { if (wantPlaying && player.state !== 1) send("playVideo"); }, ms));
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) return;
    hiddenAt = Date.now();
    if (wantPlaying) resumeInBackground();
  });
  window.addEventListener("pagehide", () => { if (wantPlaying) send("playVideo"); });

  function paintPP() {
    document.querySelectorAll("use.pp").forEach((u) => u.setAttribute("href", player.state === 1 ? "#i-pause" : "#i-play"));
  }
  const fmt = (s) => {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
  };
  function paintTime() {
    $("tCur").textContent = fmt(player.time);
    $("tDur").textContent = fmt(player.dur);
    if (!seeking) {
      const p = player.dur ? (player.time / player.dur) * 100 : 0;
      $("seek").value = p; $("seek").style.setProperty("--p", p + "%");
    }
  }

  // If iOS ignores the very first start, a tap on the video itself always works.
  function togglePlay() {
    wantPlaying = player.state !== 1;
    send(wantPlaying ? "playVideo" : "pauseVideo");
  }
  function closePlayer() {
    wantPlaying = false;
    send("stopVideo");
    iframe.src = "about:blank";
    player = freshPlayer();
    current = null;
    if (route.view === "watch") goBack();
    else { document.body.classList.remove("has-mini"); renderStage(); }
  }

  $("playPause").onclick = togglePlay;
  $("miniPP").onclick = togglePlay;
  $("miniClose").onclick = closePlayer;
  $("miniOpen").onclick = () => current && go({ view: "watch", id: current.id });
  $("back10").onclick = () => send("seekTo", [Math.max(0, player.time - 10), true]);
  $("fwd10").onclick = () => send("seekTo", [player.time + 10, true]);
  $("next").onclick = next;
  $("prev").onclick = () => (player.time > 5 ? send("seekTo", [0, true]) : step(-1));
  $("nextEnd").onclick = next;
  $("replay").onclick = () => { $("frame").classList.remove("ended"); send("seekTo", [0, true]); send("playVideo"); };
  $("shieldFull").onclick = () => (route.view === "watch" ? togglePlay() : go({ view: "watch", id: current.id }));
  $("seek").addEventListener("input", () => {
    seeking = true;
    $("seek").style.setProperty("--p", $("seek").value + "%");
    $("tCur").textContent = fmt(($("seek").value / 100) * player.dur);
  });
  $("seek").addEventListener("change", () => { seeking = false; send("seekTo", [($("seek").value / 100) * player.dur, true]); });

  // Keyboard on a computer: space/k play-pause, ←/→ or j/l seek 10s, n next, / search, Esc back.
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); document.querySelector(".search-desktop input")?.focus(); return; }
    if (e.key === "Escape" && route.view !== "home") return goBack();
    if (route.view === "shorts") {
      if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); stepShort(1); }
      else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); stepShort(-1); }
      else if (e.key === " ") { e.preventDefault(); if (sp.started) ssend(sp.state === 1 ? "pauseVideo" : "playVideo"); }
      return;
    }
    if (!current) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowLeft" || e.key === "j") $("back10").click();
    else if (e.key === "ArrowRight" || e.key === "l") $("fwd10").click();
    else if (e.key === "n") next();
  });

  if (!history.state) history.replaceState({ depth: 0, ...parseHash() }, "", location.hash || "#/");
  document.body.dataset.tab = tab;
})();
</script>
</body>
</html>
