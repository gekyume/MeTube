<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeTube">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>MeTube</title>
<style>
  :root {
    --bg: #0b0b0d; --bg-2: #111114; --surface: #17171b; --surface-2: #202026; --surface-3: #2a2a31;
    --text: #f5f5f7; --muted: #9a9aa3; --faint: #6b6b74; --line: #26262c;
    --red: #f00000; --beats: #f5b83d; --learn: #6cb6ff; --shorts: #ff6b9a; --accent: var(--beats);
    --radius: 12px; --appbar: 56px;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  }
  body[data-tab="learn"] { --accent: var(--learn); }
  body[data-tab="shorts"] { --accent: var(--shorts); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; }
  body { background: var(--bg); min-height: 100dvh; padding-bottom: calc(var(--safe-b) + 24px);
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  body.has-mini { padding-bottom: calc(var(--safe-b) + 96px); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  .ico { width: 22px; height: 22px; fill: currentColor; }
  [hidden] { display: none !important; }

  /* ---------- app bar ---------- */
  .appbar { position: sticky; top: 0; z-index: 30; padding-top: var(--safe-t);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
    border-bottom: 1px solid transparent; transition: border-color .2s; }
  .appbar.scrolled { border-bottom-color: var(--line); }
  .appbar-row { height: var(--appbar); display: flex; align-items: center; gap: 10px; padding: 0 16px;
    max-width: 1320px; margin: 0 auto; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    color: var(--text); transition: background .15s; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { background: var(--surface-3); }
  #back { margin-left: -8px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -0.03em; }
  .logo { width: 32px; height: auto; }
  .bar-title { font-weight: 650; font-size: 17px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; min-width: 0; }

  .search { position: relative; }
  .search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
  .search input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 36px 9px 36px; outline: none; -webkit-appearance: none;
    transition: border-color .15s, background .15s; }
  .search input:focus { border-color: var(--surface-3); background: var(--surface-2); outline: none; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
    border-radius: 50%; display: none; place-items: center; color: var(--muted); }
  .search.has-q .clear { display: grid; }
  .search .clear .ico { position: static; transform: none; width: 16px; height: 16px; }
  .search-mobile { margin: 0 16px 10px; }
  .search-desktop { width: min(520px, 40vw); display: none; }

  /* ---------- layout ---------- */
  .page { max-width: 1320px; margin: 0 auto; }
  .view { animation: enter .22s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .tabs { display: flex; gap: 4px; margin: 4px 16px 0; background: var(--surface); padding: 4px; border-radius: 12px; }
  .tab { flex: 1; padding: 9px 0; border-radius: 9px; font-weight: 650; color: var(--muted); transition: color .15s, background .15s; }
  .tab[aria-selected="true"] { background: var(--surface-3); color: var(--text); }
  .tab[data-tab="beats"][aria-selected="true"] { color: var(--beats); }
  .tab[data-tab="learn"][aria-selected="true"] { color: var(--learn); }
  .tab[data-tab="shorts"][aria-selected="true"] { color: var(--shorts); }

  .chips { display: flex; gap: 8px; padding: 14px 16px 6px; overflow-x: auto; scrollbar-width: none; scroll-padding: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
    background: var(--surface); color: var(--muted); font-size: 13.5px; font-weight: 550; white-space: nowrap;
    border: 1px solid transparent; transition: background .15s, color .15s; }
  .chip:hover { background: var(--surface-2); color: var(--text); }
  .chip.active { background: var(--text); color: var(--bg); }
  .chip.action { background: transparent; border-color: var(--line); color: var(--text); }
  .chip.action .ico { width: 16px; height: 16px; }
  .chip-sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 16px 8px; }
  .section-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
  .section-head .sub { color: var(--muted); font-size: 13px; }
  .link { color: var(--accent); font-size: 13.5px; font-weight: 600; white-space: nowrap; }

  /* ---------- video lists ---------- */
  .vlist { list-style: none; margin: 0; padding: 4px 0 8px; }
  .vrow { display: flex; gap: 12px; padding: 8px 16px; align-items: center; cursor: pointer; border-radius: var(--radius); }
  .vrow:active { background: var(--surface); }
  .vrow.playing { background: var(--surface); }
  .thumb { position: relative; flex: none; width: 136px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease, opacity .2s; }
  .watched .thumb img { opacity: .5; }
  .badge { position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px;
    background: var(--learn); color: #031; }
  .now-badge { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
  .dur { position: absolute; right: 6px; bottom: 6px; font-size: 11.5px; font-weight: 700; line-height: 1.3; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.82); color: #fff; font-variant-numeric: tabular-nums; }
  .thumb .progress-track ~ .dur { bottom: 9px; }
  .progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--red); }
  .progress-track { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); }
  .meta { flex: 1; min-width: 0; }
  .vtitle { font-size: 14.5px; font-weight: 550; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vsub { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .like-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--faint); }
  .like-btn.on { color: var(--beats); }
  .like-btn .ico { width: 20px; height: 20px; }
  .like-btn:hover { background: var(--surface-2); }

  /* shelves (horizontal) */
  .shelf { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 8px; scroll-snap-type: x mandatory; scroll-padding: 16px; scrollbar-width: none; }
  .shelf::-webkit-scrollbar { display: none; }
  .card { flex: none; width: 232px; scroll-snap-align: start; cursor: pointer; }
  .card .thumb { width: 100%; }
  .card .vtitle { margin-top: 8px; font-size: 14px; }

  .empty { color: var(--muted); text-align: center; padding: 48px 24px; }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .foot { color: var(--faint); font-size: 12px; text-align: center; padding: 24px 16px 8px; }

  /* channels */
  .clist { list-style: none; margin: 0; padding: 6px 0; }
  .crow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; border-radius: var(--radius); }
  .crow:hover, .crow:active { background: var(--bg-2); }
  .avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    background: var(--surface-2); color: var(--accent); }
  .crow .name { font-weight: 600; }
  .crow .count { color: var(--muted); font-size: 13px; }
  .crow > .ico { color: var(--faint); margin-left: auto; }
  .channel-hero { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .channel-hero .avatar { width: 64px; height: 64px; font-size: 26px; }
  .channel-hero h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .btn-row { display: flex; gap: 10px; padding: 0 16px 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font-weight: 650; font-size: 14px;
    background: var(--surface-2); transition: background .15s; }
  .btn:hover { background: var(--surface-3); }
  .btn.primary { background: var(--text); color: var(--bg); }
  .btn .ico { width: 18px; height: 18px; }

  /* ---------- watch ---------- */
  #stage { background: var(--bg); }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .shield { position: absolute; left: 0; right: 0; z-index: 2; }
  .shield.top { top: 0; height: 24%; }
  .shield.bottom { bottom: 0; height: 24%; }
  .shield.full { inset: 0; height: auto; display: none; cursor: pointer; }
  .frame.started .shield.full { display: block; }
  .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; font-size: 12px; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
  .frame.started .hint { display: none; }
  .endcard { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; background: #000; }
  .frame.ended .endcard { display: grid; }
  .endcard div { display: flex; gap: 10px; }

  .player-ui { padding: 10px 16px 4px; }
  .seek { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seek input { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 22px; background: transparent; cursor: pointer; margin: 0; }
  .seek input::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;
    background: linear-gradient(to right, var(--red) var(--p, 0%), var(--surface-3) var(--p, 0%)); }
  .seek input::-moz-range-track { height: 4px; border-radius: 4px; background: var(--surface-3); }
  .seek input::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--red); }
  .seek input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; }
  .seek input::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 6px 0 10px; }
  .ctl { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; transition: background .15s; }
  .ctl:hover { background: var(--surface-2); }
  .ctl.big { width: 62px; height: 62px; background: var(--text); color: var(--bg); }
  .ctl.big:hover { background: #fff; }
  .ctl .ico { width: 26px; height: 26px; }
  .ctl.big .ico { width: 30px; height: 30px; }

  .info { padding: 4px 16px 8px; }
  .info h1 { margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: -0.015em; }
  .info .why { color: var(--learn); font-size: 13.5px; margin-top: 6px; }
  .info-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
  .info-row::-webkit-scrollbar { display: none; }
  .chan-btn { flex: none; display: inline-flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border-radius: 999px; background: var(--surface); }
  .chan-btn:hover { background: var(--surface-2); }
  .chan-btn .avatar { width: 30px; height: 30px; font-size: 13px; }
  .chan-btn .name { font-weight: 600; font-size: 14px; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--surface);
    font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: background .15s; }
  .pill:hover { background: var(--surface-2); }
  .pill .ico { width: 18px; height: 18px; }
  .pill.on { color: var(--accent); }
  .upnext-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 4px; }
  .upnext-head h3 { margin: 0; font-size: 17px; }
  .upnext-head span { color: var(--muted); font-size: 13px; }

  /* ---------- "open a link" gate ---------- */
  .sheet-bg { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: grid; place-items: end center;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { width: min(100%, 520px); max-height: 92dvh; overflow-y: auto; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 20px 20px 0 0; padding: 20px 20px calc(var(--safe-b) + 20px); animation: pop .2s ease both; }
  @media (min-width: 760px) { .sheet-bg { place-items: center; } .sheet { border-radius: 20px; padding-bottom: 20px; } }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.02em; }
  .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .sheet label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .sheet label .req { color: var(--muted); font-weight: 500; }
  .sheet textarea, .sheet input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none; -webkit-appearance: none; }
  .sheet textarea { min-height: 84px; resize: vertical; }
  .sheet textarea:focus, .sheet input:focus { border-color: var(--surface-3); }
  .sheet .phrase { font-weight: 700; color: var(--text); user-select: none; -webkit-user-select: none; }
  .sheet .err { color: #ff7a7a; font-size: 13px; margin-top: 6px; min-height: 18px; }
  .sheet .actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet .actions .btn { flex: 1; justify-content: center; }
  .sheet .btn:disabled { opacity: .4; cursor: not-allowed; }
  .sheet .quota { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-bottom: 10px; }
  .sheet .log { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; color: var(--muted); }
  .sheet .log li { padding: 8px 0; border-top: 1px solid var(--line); }
  .sheet .log b { color: var(--text); font-weight: 600; }
  .ext-badge { position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: var(--surface-3); color: var(--text); }

  .toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--safe-b) + 96px); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- studio (lyrics + recording on beats) ---------- */
  .studio { margin: 8px 16px 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .studio-tabs { display: flex; border-bottom: 1px solid var(--line); }
  .studio-tabs button { flex: 1; padding: 12px 0; font-weight: 650; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; }
  .studio-tabs button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .studio-tabs .ico { width: 18px; height: 18px; }
  .studio-body { padding: 12px 14px 14px; }
  .lyrics { width: 100%; min-height: 180px; resize: vertical; font: inherit; font-size: 16px; line-height: 1.55; color: var(--text);
    background: transparent; border: 0; outline: none; padding: 0; }
  .lyrics::placeholder { color: var(--faint); }
  .studio-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .studio-row .grow { flex: 1; }
  .studio-note { color: var(--faint); font-size: 12px; }
  .small-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
  .small-btn:hover { background: var(--surface-3); }
  .small-btn .ico { width: 16px; height: 16px; }
  .small-btn.danger { color: #ff7a7a; }
  .rec-main { display: flex; align-items: center; gap: 14px; }
  .rec-btn { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 3px solid var(--text); display: grid; place-items: center; }
  .rec-btn span { width: 26px; height: 26px; border-radius: 50%; background: var(--red); transition: border-radius .15s, transform .15s; }
  .rec-btn.on span { border-radius: 6px; transform: scale(.8); }
  .rec-time { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
  .rec-time small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .takes { list-style: none; margin: 14px 0 0; padding: 0; }
  .takes li { border-top: 1px solid var(--line); padding: 10px 0; }
  .takes .t-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; }
  .takes .t-head span { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .takes .studio-row { margin-top: 8px; }
  .sync-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .sync-val { min-width: 92px; text-align: center; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .nb-item .vtitle { -webkit-line-clamp: 1; }
  .nb-preview { color: var(--muted); font-size: 13px; margin-top: 4px; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (min-width: 1000px) { body.view-watch .studio { margin-left: 0; margin-right: 0; } }

  /* ---------- series ---------- */
  .scover { position: relative; }
  .scover .stack { position: absolute; inset: -6px 10px auto 10px; height: 6px; border-radius: 8px 8px 0 0; background: var(--surface-3); }
  .series-meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .series-bar { height: 3px; border-radius: 3px; background: var(--surface-3); margin-top: 8px; overflow: hidden; }
  .series-bar span { display: block; height: 100%; background: var(--accent); }
  .series-hero { display: flex; gap: 16px; padding: 16px; align-items: center; }
  .series-hero .thumb { width: 168px; }
  .series-hero h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.02em; line-height: 1.2; }
  .ep-num { color: var(--accent); font-weight: 700; }
  .series-link { color: var(--accent); font-weight: 600; }
  @media (max-width: 480px) { .series-hero { flex-direction: column; align-items: stretch; } .series-hero .thumb { width: 100%; } }

  /* ---------- shorts ---------- */
  .sgrid { list-style: none; margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 8px 16px; }
  .scard { position: relative; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
  .scard img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .scard.watched img { opacity: .5; }
  .scard .scap { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 10px 10px; font-size: 13px; font-weight: 600; line-height: 1.25;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .scard .scap span { display: block; color: rgba(255,255,255,.7); font-size: 11.5px; font-weight: 500; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard .scap b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }

  .shorts-view { position: fixed; inset: 0; z-index: 70; background: #000; }
  body.view-shorts { overflow: hidden; }
  body.view-shorts .appbar, body.view-shorts .page { visibility: hidden; }
  /* one centered 9:16 player; a poster image shows while the next Short loads */
  .shorts-stage { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 56.25dvh); background: #000; }
  .shorts-stage img.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shorts-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; transition: opacity .15s; }
  .shorts-stage.loading iframe { opacity: 0; }
  .shorts-stage .shield.top { height: 14%; }
  .shorts-stage .shield.bottom { height: 18%; }
  .shorts-view.started .shorts-stage .shield { display: none; }
  /* after the first tap starts playback, this layer takes every touch: tap = pause/play, swipe = next/previous */
  .shorts-touch { position: absolute; inset: 0; z-index: 5; display: none; touch-action: none; cursor: pointer; }
  .shorts-view.started .shorts-touch { display: block; }
  .shorts-nav { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 8; display: flex; flex-direction: column; gap: 12px; }
  .shorts-nav button { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .shorts-nav button:disabled { opacity: .3; }
  .shorts-nav .ico { width: 24px; height: 24px; }
  .shorts-nav .up .ico { transform: rotate(-90deg); }
  .shorts-nav .down .ico { transform: rotate(90deg); }
  .shorts-slide-up { animation: slideUp .22s ease; }
  .shorts-slide-down { animation: slideDown .22s ease; }
  @keyframes slideUp { from { transform: translate(-50%, 40px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes slideDown { from { transform: translate(-50%, -40px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
  .shorts-meta { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: 0; width: min(100vw, 56.25dvh); pointer-events: none;
    padding: 60px 16px calc(var(--safe-b) + 20px); background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  .shorts-meta .t { font-weight: 650; font-size: 15px; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .shorts-meta .c { color: rgba(255,255,255,.8); font-size: 13px; margin-top: 4px; }
  .shorts-top { position: absolute; z-index: 8; top: calc(var(--safe-t) + 8px); left: 8px; right: 8px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .shorts-top > * { pointer-events: auto; }
  .shorts-top .icon-btn { background: rgba(0,0,0,.35); }
  .shorts-top .count { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.8); background: rgba(0,0,0,.35); padding: 5px 10px; border-radius: 999px; }
  .shorts-center { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 72px; height: 72px; border-radius: 50%;
    display: none; place-items: center; background: rgba(0,0,0,.45); pointer-events: none; }
  .shorts-center .ico { width: 36px; height: 36px; }
  .shorts-view.paused .shorts-center { display: grid; }
  .shorts-hint { position: absolute; z-index: 6; left: 50%; bottom: calc(var(--safe-b) + 110px); transform: translateX(-50%); pointer-events: none;
    font-size: 12.5px; font-weight: 600; background: rgba(0,0,0,.6); padding: 5px 12px; border-radius: 999px; white-space: nowrap; }

  /* ---------- mini player ---------- */
  #stage.mini { position: fixed; z-index: 40; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 8px);
    display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px;
    background: color-mix(in srgb, var(--surface-2) 92%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 10px 30px rgba(0,0,0,.45); border: 1px solid var(--line); animation: pop .2s ease both; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #stage.mini .frame { width: 112px; flex: none; border-radius: 8px; }
  #stage.mini .player-ui, #stage.mini .hint, #stage.mini .endcard { display: none; }
  .mini-bar { display: none; }
  #stage.mini .mini-bar { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .mini-text { flex: 1; min-width: 0; cursor: pointer; }
  .mini-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- computer ---------- */
  @media (min-width: 760px) {
    .search-desktop { display: block; }

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (name) => `<svg class="ico"><use href="#i-${name}"/></svg>`;
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem("metube:" + k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("metube:" + k, JSON.stringify(v)); } catch {} },
  };

  // ---------- state ----------
  let data = { beats: [], learn: [], shorts: [], topics: [], series: [] };
  let tab = store.get("tab", "beats");
  const filter = { beats: "liked", learn: "browse", shorts: "new" };
  const likeOverrides = store.get("likes", {}); // hearts tapped on this phone override the curator's list
  const isLiked = (v) => likeOverrides[v.id] ?? !!v.liked;
  const watched = new Set(store.get("watched", []));
  const hidden = new Set(store.get("hidden", []));
  const modes = store.get("modes", { beats: "next", learn: "stop" }); // next | loop | stop
  let recent = store.get("history", []); // [{id, at}], newest first
  const positions = store.get("positions", {}); // id -> {t, d}
  let query = "";
  let route = { view: "home" };
  const scrollMemory = {};

  let queue = [], queueTab = tab, current = null;
  let player = freshPlayer();
  let seeking = false, wantPlaying = false, pendingSeek = 0, lastSave = 0, hiddenAt = 0;
  function freshPlayer() { return { state: -1, time: 0, timeAt: 0, dur: 0, ready: false, started: false }; }
  // The player reports its time a few times a second; estimate where the beat is right now between reports.
  const beatNow = () => (player.state === 1 ? player.time + (performance.now() - player.timeAt) / 1000 : player.time);

  // ---------- data ----------
  fetch("videos.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((d) => { data = { topics: [], shorts: [], series: [], ...d }; applyRoute(parseHash(), false); })
    .catch(() => { $("viewRoot").innerHTML = `<div class="empty"><strong>Couldn't load your library</strong>Check your connection and reopen MeTube.</div>`; });

  const allItems = (section) => (data[section] || []).filter((v) => !hidden.has(v.id));
  const sectionOf = (id) => ((data.beats || []).some((x) => x.id === id) ? "beats" : "learn");
  // Videos opened through the "Open a link" gate live only in this device's log, not in the library.
  let linkLog = store.get("linklog", []); // [{id, title, channel, reason, at}], newest first
  const externalVideo = (id) => { const e = linkLog.find((x) => x.id === id); return e && { ...e, title: e.title || "Linked video", external: true }; };
  const findVideo = (id) => (data.beats || []).find((x) => x.id === id) || (data.learn || []).find((x) => x.id === id) || externalVideo(id);

  // Beat moods, guessed from the "type beat" artists and style words in each title (a beat can have several).
  const MOODS = [
    ["Chill", ["chill", "jazz", "lofi", "lo-fi", "smino", "steve lacy", "jordan ward", "daniel caesar", "frank ocean", "dijon", "sainte",
      "isaiah rashad", "aaron may", "tommy richman", "brent faiyaz", "don toliver", "neo soul", "neo -soul", "sza", "bieber", "sade",
      "erykah", "reggae", "earl sweatshirt", "young nudy", "lucki", "piano"]],
    ["Hype", ["hard", "bouncy", "trap", "nba youngboy", "glokknine", "9lokknine", "lpb poody", "real boston richey", "big yavo",
      "wizz havinn", "dababy", "travis scott", "iceman", "detroit", "florida", "el snappo", "loe shimmy", "hurricane wisdom", "jerk",
      "baby keem", "asap rocky", "bak jay", "yn jay", "babyfxce", "babyface ray", "veeze", "nine vicious", "lil noonie", "az chike",
      "bluebucksclan", "rucci", "rick ross", "concrete", "prxphecy", "lil nas x", "montero", "iann dior", "tyler the creator", "doechii"]],
    ["Conscious", ["j cole", "kendrick", "joey bada", "joey badass", "erick the architect", "dreamville", "chance the rapper", "cordae",
      "earl sweatshirt", "mf doom", "schoolboy q", "alchemist", "underground", "big noyd"]],
    ["Boom Bap", ["boom bap", "old school", "90s", "mf doom", "alchemist", "joey bada", "lethalneedle", "vintageman", "templum", "mixla"]],
    ["Soulful", ["soul", "gospel", "sample", "kanye", "chance the rapper", "amy winehouse", "70s", "clayh", "choir"]],
    ["Emotional", ["emotional", "sad", "tears", "ballad", "pain", "falling in love", "regrets", "piano", "my space prod", "drake type beat"]],
    ["Throwback", ["2000s", "90s", "r&b-pop", "dougie", "lil wayne", "jay z", "50 cent", "pharrell", "lil tecca", "jack harlow", "old school kanye"]],
    ["Epic", ["stadium", "cinematic", "yeezus", "life of pablo", "champion", "beat switch", "trumpet", "brass", "award show", "greatest"]],
  ];
  const moodCache = new Map();
  function moodsOf(v) {
    if (!moodCache.has(v.id)) {
      const hay = `${v.title} ${v.channel}`.toLowerCase();
      moodCache.set(v.id, MOODS.filter(([, words]) => words.some((w) => hay.includes(w))).map(([m]) => m));
    }
    return moodCache.get(v.id);
  }

  // Round-robin across channels so the Shorts feed keeps changing topic instead of 12 in a row from one channel.
  function interleave(items) {
    const by = new Map();
    for (const v of items) { if (!by.has(v.channel)) by.set(v.channel, []); by.get(v.channel).push(v); }
    const lanes = [...by.values()], out = [];
    for (let i = 0; out.length < items.length; i++) for (const l of lanes) if (l[i]) out.push(l[i]);
    return out;
  }

  function listFor(section, f = filter[section]) {
    const items = section === "shorts" ? interleave(allItems(section)) : allItems(section);
    if (query) {
      const words = query.toLowerCase().split(/\s+/).filter(Boolean);
      return items.filter((v) => { const hay = `${v.title} ${v.channel} ${v.topic || ""} ${v.series || ""}`.toLowerCase(); return words.every((w) => hay.includes(w)); });
    }
    if (f === "recent") { const byId = new Map(items.map((v) => [v.id, v])); return recent.map((h) => byId.get(h.id)).filter(Boolean); }
    if (f === "liked") return items.filter(isLiked);
    if (f === "new") return items.filter((v) => !watched.has(v.id));
    if (f === "picks") return items.filter((v) => v.source === "discovery");
    if (f === "quick") return items.filter((v) => v.dur && v.dur <= 600);
    if (f.startsWith("mood:")) return items.filter((v) => moodsOf(v).includes(f.slice(5)));
    if (f.startsWith("topic:")) return items.filter((v) => v.topic === f.slice(6));
    if (f.startsWith("channel:")) return items.filter((v) => v.channel === f.slice(8));
    if (f.startsWith("series:")) return items.filter((v) => v.series === f.slice(7)).sort((a, b) => (a.pos ?? a.ep) - (b.pos ?? b.ep));
    return items;
  }

  // ---------- routing (hash URLs, so the browser/iOS back gesture works too) ----------
  function hashFor(r) {
    if (r.view === "watch") return `#/watch/${r.id}`;
    if (r.view === "channel") return `#/channel/${r.tab}/${encodeURIComponent(r.name)}`;
    if (r.view === "channels") return `#/channels/${r.tab}`;
    if (r.view === "shorts") return `#/shorts/${r.id}`;
    if (r.view === "series") return `#/series/${encodeURIComponent(r.name)}`;
    if (r.view === "notebook") return "#/notebook";
    return "#/";
  }
  function parseHash() {
    const [, view, a, b] = location.hash.split("/");
    if (view === "watch" && a) return { view: "watch", id: a };
    if (view === "channel" && a && b) return { view: "channel", tab: a, name: decodeURIComponent(b) };
    if (view === "channels" && a) return { view: "channels", tab: a };
    if (view === "shorts" && a) return { view: "shorts", id: a };
    if (view === "series" && a) return { view: "series", name: decodeURIComponent(a) };
    if (view === "notebook") return { view: "notebook" };
    return { view: "home" };
  }
  function go(r, { replace = false } = {}) {
    scrollMemory[hashFor(route)] = window.scrollY;
    const depth = (history.state?.depth || 0) + (replace ? 0 : 1);
    const state = { ...r, depth };
    if (replace) history.replaceState(state, "", hashFor(r)); else history.pushState(state, "", hashFor(r));
    applyRoute(r, false);
  }
  function goBack() {
    if ((history.state?.depth || 0) > 0) history.back();
    else go({ view: "home" }, { replace: true });
  }
  window.addEventListener("popstate", (e) => {
    scrollMemory[hashFor(route)] = window.scrollY;
    applyRoute(e.state || parseHash(), true);
  });

  function applyRoute(r, restoreScroll) {
    if (r.view === "watch") {
      const v = findVideo(r.id);
      if (!v) return go({ view: "home" }, { replace: true });
      if (current?.id !== v.id) {
        const section = sectionOf(v.id);
        const q = v.external ? [v] : queue.some((x) => x.id === v.id) ? queue : listFor(section, "all");
        startVideo(v, q);
      }
    }
    if ((r.view === "channel" || r.view === "channels") && r.tab !== tab) setTab(r.tab);
    if (r.view === "series" && tab !== "learn") setTab("learn");
    if (r.view === "shorts" && !(data.shorts || []).some((v) => v.id === r.id)) return go({ view: "home" }, { replace: true });
    route = { view: r.view, id: r.id, tab: r.tab, name: r.name };
    document.body.className = `view-${r.view}` + (current && r.view !== "watch" ? " has-mini" : "");
    document.body.dataset.tab = r.view === "watch" ? queueTab : tab;
    renderChrome();
    renderStage();
    renderShorts(r);
    if (r.view === "shorts") return;
    renderView();
    const y = restoreScroll ? scrollMemory[hashFor(r)] || 0 : 0;
    requestAnimationFrame(() => window.scrollTo(0, y));
  }

  // ---------- app bar ----------
  function renderChrome() {
    const home = route.view === "home";
    $("back").hidden = home;
    $("brand").hidden = !home;
    $("barTitle").hidden = home;
    $("linkBtn").hidden = !home;
    $("barTitle").textContent =
      route.view === "channel" ? route.name :
      route.view === "series" ? "Series" :
      route.view === "notebook" ? "Notebook" :
      route.view === "channels" ? (tab === "beats" ? "Producers" : "Channels") :
      route.view === "watch" ? (queueTab === "beats" ? "Beats" : "Learn") : "";
    document.querySelectorAll("[data-search]").forEach((el) => {
      el.hidden = !home;
      el.classList.toggle("has-q", !!query);
      const input = el.querySelector("input");
      if (document.activeElement !== input) input.value = query;
    });
  }

  // ---------- views ----------
  function renderView() {
    const root = $("viewRoot");
    root.innerHTML = "";
    root.classList.remove("view"); void root.offsetWidth; root.classList.add("view"); // replay the fade-in
    if (route.view === "home") renderHome(root);
    else if (route.view === "channels") renderChannels(root);
    else if (route.view === "channel") renderChannel(root);
    else if (route.view === "series") renderSeries(root);
    else if (route.view === "notebook") renderNotebook(root);
  }

  function renderHome(root) {
    root.insertAdjacentHTML("beforeend", `
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="beats" aria-selected="${tab === "beats"}">Beats</button>
        <button class="tab" role="tab" data-tab="learn" aria-selected="${tab === "learn"}">Learn</button>
        <button class="tab" role="tab" data-tab="shorts" aria-selected="${tab === "shorts"}">Shorts</button>
      </div>
      <div class="chips"></div>`);
    root.querySelectorAll(".tab").forEach((t) => (t.onclick = () => { setTab(t.dataset.tab); query = ""; renderChrome(); renderView(); window.scrollTo(0, 0); }));

    const chips = root.querySelector(".chips");
    const addChip = (label, active, onclick, cls = "") => {
      const b = document.createElement("button");
      b.className = `chip ${cls}${active ? " active" : ""}`;
      b.innerHTML = label;
      b.onclick = onclick;
      chips.append(b);
    };
    const setFilter = (f) => () => { filter[tab] = f; query = ""; renderChrome(); renderView(); };
    const f = query ? "" : filter[tab];
    if (tab === "beats") {
      addChip(`${icon("shuffle")}Shuffle`, false, () => { const q = shuffled(listFor("beats")); if (q.length) playFrom(q[0], q); }, "action");
      addChip("Liked", f === "liked", setFilter("liked"));
      addChip("Recent", f === "recent", setFilter("recent"));
      addChip("All beats", f === "all", setFilter("all"));
      addChip(`${icon("book")}Notebook`, false, () => go({ view: "notebook" }), "action");
      chips.insertAdjacentHTML("beforeend", `<span class="chip-sep"></span>`);
      const beats = allItems("beats");
      for (const [m] of MOODS) if (beats.some((v) => moodsOf(v).includes(m))) addChip(m, f === `mood:${m}`, setFilter(`mood:${m}`));
    } else if (tab === "shorts") {
      addChip(`${icon("play")}Start scrolling`, false, () => { const q = listFor("shorts"); const list = q.length ? q : allItems("shorts"); if (list.length) openShorts(list[0], list); }, "action");
      addChip("New", f === "new", setFilter("new"));
      addChip("All", f === "all", setFilter("all"));
    } else {
      addChip("Browse", f === "browse", setFilter("browse"));
      addChip("New", f === "new", setFilter("new"));
      addChip("Quick (≤10 min)", f === "quick", setFilter("quick"));
      addChip("Recent", f === "recent", setFilter("recent"));
      if (allItems("learn").some((v) => v.source === "discovery")) addChip("Curator picks", f === "picks", setFilter("picks"));
      for (const t of data.topics || []) addChip(esc(t), f === `topic:${t}`, setFilter(`topic:${t}`));
    }
    chips.insertAdjacentHTML("beforeend", `<span class="chip-sep"></span>`);
    addChip(`${icon("grid")}${tab === "beats" ? "Producers" : "Channels"}`, false, () => go({ view: "channels", tab }), "action");
    const active = chips.querySelector(".active");
    if (active) chips.scrollLeft = Math.max(0, active.offsetLeft - 60);

    if (!query && tab === "learn" && filter.learn === "browse") return renderBrowse(root);

    const list = listFor(tab);
    if (tab === "shorts") {
      if (query) root.insertAdjacentHTML("beforeend", `<div class="section-head"><h2>Results for “${esc(query)}”</h2><span class="sub">${list.length}</span></div>`);
      if (!list.length) root.insertAdjacentHTML("beforeend", query ? emptyState() : `<div class="empty"><strong>You've seen them all</strong>New Shorts arrive every morning. Tap All to rewatch.</div>`);
      else root.append(shortsGrid(list));
      return footer(root);
    }
    if (query) root.insertAdjacentHTML("beforeend", `<div class="section-head"><h2>Results for “${esc(query)}”</h2><span class="sub">${list.length}</span></div>`);
    if (!list.length) root.insertAdjacentHTML("beforeend", emptyState());
    else root.append(videoList(list, { grid: true, showWhen: !query && filter[tab] === "recent" }));
    footer(root);
  }

  function emptyState() {
    if (query) return `<div class="empty"><strong>No matches</strong>Search looks through your MeTube library only.</div>`;
    const f = filter[tab];
    if (f === "recent") return `<div class="empty"><strong>Nothing watched yet</strong>Videos you play show up here.</div>`;
    if (f === "new") return `<div class="empty"><strong>You're caught up</strong>New videos arrive every morning.</div>`;
    if (f === "liked") return `<div class="empty"><strong>No liked beats</strong>Tap the heart on any beat to save it here.</div>`;
    return `<div class="empty"><strong>Nothing here yet</strong></div>`;
  }

  function renderBrowse(root) {
    const learn = allItems("learn");
    const cont = recent.map((h) => learn.find((v) => v.id === h.id)).filter((v) => v && progressOf(v.id) > 2 && progressOf(v.id) < 95);
    const shelves = [];
    if (cont.length) shelves.push(["Continue watching", cont, "recent"]);
    const fresh = learn.filter((v) => !watched.has(v.id));
    if (fresh.length) shelves.push(["New for you", fresh.slice(0, 14), "new", fresh.length]);
    const quick = learn.filter((v) => v.dur && v.dur <= 600 && !watched.has(v.id));
    if (quick.length) shelves.push(["Quick watches · under 10 min", quick.slice(0, 14), "quick", quick.length]);
    const picks = learn.filter((v) => v.source === "discovery");
    if (picks.length) shelves.push(["Curator picks", picks.slice(0, 14), "picks", picks.length]);
    for (const t of data.topics || []) {
      const items = learn.filter((v) => v.topic === t);
      if (items.length) shelves.push([t, items.slice(0, 14), `topic:${t}`, items.length]);
    }
    const seriesShelf = () => {
      if (!(data.series || []).length) return;
      const head = document.createElement("div");
      head.className = "section-head";
      head.innerHTML = `<h2>Series</h2><span class="sub">Watch in order</span>`;
      const shelf = document.createElement("div");
      shelf.className = "shelf";
      for (const se of data.series) shelf.append(seriesCard(se));
      root.append(head, shelf);
    };
    if (!cont.length) seriesShelf();
    for (const [name, items, key, total] of shelves) {
      const head = document.createElement("div");
      head.className = "section-head";
      head.innerHTML = `<h2>${esc(name)}</h2><button class="link">See all${total ? ` ${total}` : ""} ›</button>`;
      head.querySelector("button").onclick = () => { filter.learn = key; renderView(); window.scrollTo(0, 0); };
      const shelf = document.createElement("div");
      shelf.className = "shelf";
      for (const v of items) shelf.append(card(v, items));
      root.append(head, shelf);
      if (key === "recent") seriesShelf(); // Series sits right after Continue watching
    }
    footer(root);
  }

  function renderChannels(root) {
    const counts = new Map();
    for (const v of allItems(tab)) counts.set(v.channel, (counts.get(v.channel) || 0) + 1);
    const names = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
    root.insertAdjacentHTML("beforeend", `<div class="section-head"><h2>${tab === "beats" ? "Beat producers" : "Channels"}</h2><span class="sub">${names.length}</span></div>`);
    const ul = document.createElement("ul");
    ul.className = "clist";
    for (const name of names) {
      const li = document.createElement("li");
      li.className = "crow";
      li.innerHTML = `<div class="avatar">${esc(initial(name))}</div>
        <div><div class="name">${esc(name)}</div><div class="count">${counts.get(name)} video${counts.get(name) === 1 ? "" : "s"}</div></div>
        ${icon("chev")}`;
      li.onclick = () => go({ view: "channel", tab, name });
      ul.append(li);
    }
    root.append(ul);
  }

  function renderChannel(root) {
    const list = listFor(tab, `channel:${route.name}`);
    root.insertAdjacentHTML("beforeend", `
      <div class="channel-hero"><div class="avatar">${esc(initial(route.name))}</div>
        <div><h2>${esc(route.name)}</h2><div class="vsub">${list.length} video${list.length === 1 ? "" : "s"} in your library</div></div></div>
      <div class="btn-row">
        <button class="btn primary" data-act="play">${icon("play")}Play all</button>
        <button class="btn" data-act="shuffle">${icon("shuffle")}Shuffle</button>
      </div>`);
    const start = (q) => q.length && (tab === "shorts" ? openShorts(q[0], q) : playFrom(q[0], q));
    root.querySelector('[data-act="play"]').onclick = () => start(list);
    root.querySelector('[data-act="shuffle"]').onclick = () => start(shuffled(list));
    if (list.length) root.append(tab === "shorts" ? shortsGrid(list) : videoList(list, { grid: true }));
    else root.insertAdjacentHTML("beforeend", emptyState());
  }

  function footer(root) {
    if (!data.updatedAt) return;
    const days = Math.floor((Date.now() - new Date(data.updatedAt)) / 864e5);
    const n = (data.beats?.length || 0) + (data.learn?.length || 0) + (data.shorts?.length || 0);
    root.insertAdjacentHTML("beforeend", `<div class="foot">${n} videos · library updated ${days <= 0 ? "today" : days === 1 ? "yesterday" : `${days} days ago`}</div>`);
  }

  // ---------- video components ----------
  function thumbHTML(v) {
    const p = progressOf(v.id);
    return `<div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg">
      ${v.source === "discovery" ? '<span class="badge">PICK</span>' : ""}
      ${v.external ? '<span class="ext-badge">LINK</span>' : ""}
      ${current?.id === v.id ? '<span class="now-badge">NOW PLAYING</span>' : ""}
      ${p && current?.id !== v.id ? `<span class="progress-track"></span><span class="progress" style="width:${p}%"></span>` : ""}
      ${v.dur && current?.id !== v.id ? `<span class="dur">${fmt(v.dur)}</span>` : ""}</div>`;
  }

  const epLabel = (v) => (v.ep ? `Ep ${v.ep}` : "Extra");
  function seriesEpisodes(name) { return listFor("learn", `series:${name}`); }
  function seriesProgress(name) {
    const eps = seriesEpisodes(name);
    const done = eps.filter((v) => watched.has(v.id)).length;
    const nextEp = eps.find((v) => !watched.has(v.id)) || eps[0];
    return { eps, done, nextEp };
  }
  function seriesCard(se) {
    const { eps, done } = seriesProgress(se.name);
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="scover"><span class="stack"></span><div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${se.cover}/mqdefault.jpg">
        <span class="dur">${eps.length} episodes</span></div></div>
      <div class="vtitle">${esc(se.name.replace(/^Crash Course /, ""))}</div>
      <div class="series-meta">Crash Course · ${done ? `${done} of ${eps.length} watched` : "Not started"}</div>
      <div class="series-bar"><span style="width:${eps.length ? Math.round((done / eps.length) * 100) : 0}%"></span></div>`;
    el.onclick = () => go({ view: "series", name: se.name });
    return el;
  }
  function renderSeries(root) {
    const se = (data.series || []).find((x) => x.name === route.name);
    if (!se) { root.insertAdjacentHTML("beforeend", `<div class="empty"><strong>Series not found</strong></div>`); return; }
    const { eps, done, nextEp } = seriesProgress(se.name);
    root.insertAdjacentHTML("beforeend", `
      <div class="series-hero">
        <div class="thumb"><img alt="" src="https://i.ytimg.com/vi/${se.cover}/mqdefault.jpg"></div>
        <div><h2>${esc(se.name)}</h2>
          <div class="vsub">${eps.length} episodes · ${esc(se.topic || "")}${done ? ` · ${done} watched` : ""}</div>
          <div class="series-bar"><span style="width:${Math.round((done / Math.max(1, eps.length)) * 100)}%"></span></div></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" data-act="continue">${icon("play")}${done ? `Continue · ${epLabel(nextEp)}` : "Start from the beginning"}</button>
        ${done ? `<button class="btn" data-act="restart">${icon("loop")}From the start</button>` : ""}
        <button class="btn" data-act="share">${icon("share")}Share</button>
      </div>`);
    root.querySelector('[data-act="continue"]').onclick = () => playFrom(nextEp, eps);
    root.querySelector('[data-act="share"]').onclick = () => shareLink(se.name, appLink({ view: "series", name: se.name }));
    root.querySelector('[data-act="restart"]')?.addEventListener("click", () => playFrom(eps[0], eps));
    root.append(videoList(eps, { grid: true, section: "learn" }));
  }

  function subText(v, showWhen) {
    if (v.series && !showWhen) return `${epLabel(v)} · ${v.series.replace(/^Crash Course /, "")}`;
    const seenAt = showWhen && recent.find((h) => h.id === v.id)?.at;
    return [v.channel, seenAt ? `watched ${agoTime(seenAt)}` : ago(v.published)].filter(Boolean).join(" · ");
  }

  function videoList(list, { grid = false, showWhen = false, section = tab, onPick } = {}) {
    const ul = document.createElement("ul");
    ul.className = "vlist" + (grid ? " grid" : "");
    for (const v of list) {
      const li = document.createElement("li");
      li.className = "vrow" + (watched.has(v.id) && current?.id !== v.id ? " watched" : "") + (current?.id === v.id ? " playing" : "");
      li.innerHTML = `${thumbHTML(v)}
        <div class="meta"><div class="vtitle">${esc(v.title)}</div><div class="vsub">${esc(subText(v, showWhen))}</div></div>
        ${section === "beats" ? `<button class="like-btn${isLiked(v) ? " on" : ""}" aria-label="Like">${icon(isLiked(v) ? "heart" : "heart-o")}</button>` : ""}`;
      li.onclick = () => (onPick ? onPick(v) : playFrom(v, list));
      const like = li.querySelector(".like-btn");
      if (like) like.onclick = (e) => {
        e.stopPropagation(); toggleLike(v);
        like.classList.toggle("on", isLiked(v)); like.innerHTML = icon(isLiked(v) ? "heart" : "heart-o");
      };
      ul.append(li);
    }
    return ul;
  }

  function card(v, list) {
    const el = document.createElement("div");
    el.className = "card" + (watched.has(v.id) && current?.id !== v.id ? " watched" : "");
    el.innerHTML = `${thumbHTML(v)}<div class="vtitle">${esc(v.title)}</div><div class="vsub">${esc(v.channel)}</div>`;
    el.onclick = () => playFrom(v, list);
    return el;
  }

  function shortThumb(id) { return `https://i.ytimg.com/vi/${id}/oar2.jpg`; }
  function shortsGrid(list) {
    const ul = document.createElement("ul");
    ul.className = "sgrid";

  // ---------- helpers ----------
  function initial(name) { return (String(name).replace(/^[^A-Za-z0-9]+/, "")[0] || "?").toUpperCase(); }
  function ago(iso) {
    const d = Math.floor((Date.now() - new Date(iso)) / 864e5);
    if (!iso || isNaN(d)) return "";
    if (d < 1) return "today";
    if (d < 30) return `${d}d ago`;
    if (d < 365) return `${Math.floor(d / 30)}mo ago`;
    return `${Math.floor(d / 365)}y ago`;
  }
  function agoTime(ms) {
    const m = Math.floor((Date.now() - ms) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return `${m}m ago`;
    if (m < 1440) return `${Math.floor(m / 60)}h ago`;
    return `${Math.floor(m / 1440)}d ago`;
  }
  function progressOf(id) { const p = positions[id]; return p && p.d ? Math.min(100, Math.round((p.t / p.d) * 100)) : 0; }
  function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function toggleLike(v) { likeOverrides[v.id] = !isLiked(v); store.set("likes", likeOverrides); }
  function setTab(t) { tab = t; store.set("tab", t); document.body.dataset.tab = t; }

  // ---------- "Open a link": the only way to reach a video outside the library, on purpose a hassle ----------
  const LINK = { perDay: 3, waitSec: 15, minReason: 20, phrase: "this is absolutely essential" };
  const todayKey = () => new Date().toLocaleDateString("en-CA");
  const usedToday = () => linkLog.filter((x) => new Date(x.at).toLocaleDateString("en-CA") === todayKey()).length;

  // Accepts only single-video links (watch, youtu.be, shorts, embed, live). Words, channels, playlists and search pages are refused.
  function parseVideoLink(text) {
    let u;
    try { u = new URL(text.trim()); } catch { return { error: "That's not a link. MeTube only opens pasted video links. It doesn't search." }; }
    const host = u.hostname.replace(/^www\.|^m\.|^music\./, "");
    if (!["youtube.com", "youtu.be", "youtube-nocookie.com"].includes(host)) return { error: "Only YouTube video links work here." };
    let id = null;
    if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
    else if (u.pathname === "/watch") id = u.searchParams.get("v");
    else { const m = u.pathname.match(/^\/(shorts|embed|live)\/([\w-]{11})/); if (m) id = m[2]; }
    if (!id || !/^[\w-]{11}$/.test(id)) return { error: "That link isn't a single video. Channels, playlists and search pages aren't allowed." };
    return { id };
  }

  function openLinkGate() {
    const left = LINK.perDay - usedToday();
    const bg = document.createElement("div");
    bg.className = "sheet-bg";
    const close = () => { clearInterval(timer); bg.remove(); };
    bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
    const logHTML = linkLog.length
      ? `<label>Your recent link opens</label><ul class="log">${linkLog.slice(0, 5).map((x) =>
          `<li><b>${esc(x.title || x.id)}</b><br>“${esc(x.reason)}” · ${agoTime(x.at)}</li>`).join("")}</ul>` : "";

    if (left <= 0) {
      bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Open a link">

        ${logHTML}

      bg.querySelector("[data-close]").onclick = close;
      document.body.append(bg);
      var timer;
      return;
    }

    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Open a link">
      <span class="quota">${left} of ${LINK.perDay} left today</span>
      <h2>Is this absolutely essential?</h2>
      <p>This is the only way out of your library. Take a breath first.</p>
      <label for="lgReason">Why do you need this video? <span class="req">(at least ${LINK.minReason} characters)</span></label>
      <textarea id="lgReason" placeholder="e.g. My professor assigned this lecture for Thursday"></textarea>
      <label for="lgPhrase">Type “<span class="phrase">${LINK.phrase}</span>” to confirm</label>
      <input id="lgPhrase" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="err" id="lgErr1"></div>
      <div class="actions">
        <button class="btn" data-close>Never mind</button>
        <button class="btn primary" id="lgNext" disabled>Wait ${LINK.waitSec}s</button>
      </div>
      ${logHTML}
    </div>`;
    document.body.append(bg);
    const reason = bg.querySelector("#lgReason"), phrase = bg.querySelector("#lgPhrase"), nextBtn = bg.querySelector("#lgNext");
    phrase.addEventListener("paste", (e) => e.preventDefault()); // you have to actually type it
    let wait = LINK.waitSec;
    const ok = () => reason.value.trim().length >= LINK.minReason && phrase.value.trim().toLowerCase() === LINK.phrase;
    const paint = () => {
      nextBtn.disabled = wait > 0 || !ok();
      nextBtn.textContent = wait > 0 ? `Wait ${wait}s` : "Continue";
      const r = reason.value.trim().length;
      bg.querySelector("#lgErr1").textContent = r && r < LINK.minReason ? `${LINK.minReason - r} more characters` : "";
    };
    var timer = setInterval(() => { wait = Math.max(0, wait - 1); paint(); if (!wait) clearInterval(timer); }, 1000);
    reason.addEventListener("input", paint); phrase.addEventListener("input", paint);
    bg.querySelector("[data-close]").onclick = close;
    nextBtn.onclick = () => { if (ok() && wait === 0) step2(reason.value.trim()); };
    setTimeout(() => reason.focus(), 50);

    function step2(why) {
      const sheet = bg.querySelector(".sheet");
      sheet.innerHTML = `
        <span class="quota">${left} of ${LINK.perDay} left today</span>
        <h2>Paste the video link</h2>
        <p>Links only. Typing words won't search YouTube.</p>
        <label for="lgUrl">YouTube video link</label>
        <input id="lgUrl" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="err" id="lgErr2"></div>
        <div class="actions">
          <button class="btn" data-close>Never mind</button>
          <button class="btn primary" id="lgOpen" disabled>Open video</button>
        </div>`;
      const url = sheet.querySelector("#lgUrl"), open = sheet.querySelector("#lgOpen"), err = sheet.querySelector("#lgErr2");
      sheet.querySelector("[data-close]").onclick = close;
      url.addEventListener("input", () => {
        const r = url.value.trim() ? parseVideoLink(url.value) : {};
        err.textContent = r.error || "";
        open.disabled = !r.id;
      });
      open.onclick = () => {
        const r = parseVideoLink(url.value);
        if (!r.id) return;
        const existing = findVideo(r.id);
        if (!existing || existing.external) {
          linkLog = [{ id: r.id, title: "", channel: "", reason: why, at: Date.now() }, ...linkLog.filter((x) => x.id !== r.id)].slice(0, 100);
        } else {
          linkLog = [{ id: r.id, title: existing.title, channel: existing.channel, reason: why, at: Date.now() }, ...linkLog].slice(0, 100);
        }
        store.set("linklog", linkLog);
        close();
        const v = findVideo(r.id);
        playFrom(v, [v]);
      };
      setTimeout(() => url.focus(), 50);
    }
  }

  // Copy the beat's YouTube link, then open the converter in a new tab (Safari, when running from the home screen).
  const CONVERTER = "https://convertytmp3.org/";
  function copyAndConvert(v) {
    const url = `https://www.youtube.com/watch?v=${v.id}`;
    copyText(url);

  }
  // Share: the iPhone share sheet when available, otherwise copy the link.
  const appLink = (r) => location.origin + location.pathname + hashFor(r);
  function shareVideo(v) {
    // Library videos open inside MeTube for the other person; one-off linked videos only exist on this phone, so share YouTube's link.
    const url = v.external ? `https://youtu.be/${v.id}` : appLink({ view: "watch", id: v.id });

  async function shareLink(title, url) {
    if (navigator.share) {
      try { await navigator.share({ title, text: title, url }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    copyText(url);
    toast("Link copied");
  }
  function copyText(text) {
    const fallback = () => {
      const ta = Object.assign(document.createElement("textarea"), { value: text, readOnly: true });
      ta.style.cssText = "position:fixed;opacity:0;top:0";
      document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
      try { document.execCommand("copy"); } catch {}

    };
    try { navigator.clipboard ? navigator.clipboard.writeText(text).catch(fallback) : fallback(); } catch { fallback(); }
  }
  let toastTimer;
  function toast(msg) {

    t.textContent = msg; t.classList.add("show");

  // ---------- shorts feed: one player, paged with swipes (after the first tap) or the ▲/▼ buttons ----------
  const sframe = $("syt"), sstage = $("shortsStage"), sview = $("shortsView");
  let shortsList = [], shortsIdx = -1, sp = freshPlayer(), loadTimer;
  const ssend = (func, args = []) => sframe.contentWindow?.postMessage(JSON.stringify({ event: "command", func, args, id: 2, channel: "widget" }), ORIGIN);
  // YouTube's own controls are on so there's a real ▶ button to tap for the first start (iOS requires a tap inside the video).
  const shortsEmbedUrl = (id) => `${ORIGIN}/embed/${id}?` + new URLSearchParams({
    enablejsapi: 1, controls: 1, playsinline: 1, rel: 0, iv_load_policy: 3, fs: 0, modestbranding: 1, autoplay: 1, origin: location.origin,
  });

  function openShorts(v, list) {
    shortsList = list.slice();
    go({ view: "shorts", id: v.id });
  }

  function renderShorts(r) {
    const on = r.view === "shorts";
    sview.hidden = !on;
    if (!on) { ssend("pauseVideo"); shortsIdx = -1; return; }
    if (wantPlaying) { wantPlaying = false; send("pauseVideo"); } // pause the regular player while watching Shorts
    if (!shortsList.some((x) => x.id === r.id)) shortsList = allItems("shorts");
    showShort(Math.max(0, shortsList.findIndex((x) => x.id === r.id)), 0);
  }

  function showShort(i, dir) {
    if (!shortsList[i] || (i === shortsIdx && dir)) return;
    shortsIdx = i;
    const v = shortsList[i];
    $("shortsTitle").textContent = v.title.replace(/#\S+/g, "").trim();
    $("shortsChannel").textContent = v.channel;
    $("shortsCount").textContent = `${i + 1} / ${shortsList.length}`;
    $("shortsPrev").disabled = i === 0;
    $("shortsNext").disabled = i === shortsList.length - 1;
    const poster = $("shortsPoster");
    poster.onerror = () => { poster.onerror = null; poster.src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`; };
    poster.src = shortThumb(v.id);
    history.replaceState({ ...history.state, view: "shorts", id: v.id }, "", hashFor({ view: "shorts", id: v.id }));
    route.id = v.id;

    if (!sframe.src.startsWith(ORIGIN)) return;

      if (sp.ready || ++tries > 40) clearInterval(t);

  function onShortsMessage(msg) {
    const info = msg.info;
    if (msg.event === "onReady") sp.ready = true;
    let s = msg.event === "onStateChange" ? (typeof info === "number" ? info : info?.playerState) : undefined;
    if (msg.event === "infoDelivery" && info) { sp.ready = true; if (typeof info.playerState === "number") s = info.playerState; }

  // Touch layer: tap toggles play, vertical swipe changes Short. Only active once a Short has started.

    layer.addEventListener("touchstart", (e) => { const t = e.touches[0]; y0 = t.clientY; x0 = t.clientX; t0 = Date.now(); }, { passive: true });

  // ---------- studio: write lyrics and record vocal takes over a beat ----------
  const lyrics = store.get("lyrics", {}); // beat id -> {text, at}
  let studioFor = null, studioTab = store.get("studioTab", "lyrics");
  let rec = null, takePlayer = null;

  const SYNC_STEP = 20; // ms per tap
  let syncDefault = store.get("syncDefault", 0);

  // Takes are audio files, too big for localStorage, so they live in this device's IndexedDB.
  const idb = (() => {
    let dbp;
    const open = () => (dbp ||= new Promise((res, rej) => {
      const r = indexedDB.open("metube", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("takes", { keyPath: "id" }).createIndex("beat", "beat");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("takes", mode);
        const req = fn(t.objectStore("takes"));
        t.oncomplete = () => res(req.result);
        t.onerror = () => rej(t.error);
      });
    };
    return {
      put: (v) => tx("readwrite", (st) => st.put(v)),
      del: (id) => tx("readwrite", (st) => st.delete(id)),
      byBeat: (beat) => tx("readonly", (st) => st.index("beat").getAll(beat)),
      all: () => tx("readonly", (st) => st.getAll()),
    };
  })();

  function renderStudio() {

  function renderLyrics() {
    const body = $("studioBody"), id = current.id;
    body.innerHTML = `<textarea class="lyrics" placeholder="Write your bars here. They save as you type." spellcheck="false" autocapitalize="sentences" aria-label="Lyrics"></textarea>
      <div class="studio-row">

        <button class="small-btn" data-a="copy">${icon("share")}Copy</button>
        <span class="grow"></span><span class="studio-note" id="lyrSaved"></span>
      </div>`;
    const ta = body.querySelector("textarea");
    ta.value = lyrics[id]?.text || "";
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(180, ta.scrollHeight) + "px"; };
    const save = () => {
      if (ta.value.trim()) lyrics[id] = { text: ta.value, at: Date.now() }; else delete lyrics[id];
      store.set("lyrics", lyrics);
      $("lyrSaved").textContent = lyrics[id] ? "Saved" : "";
